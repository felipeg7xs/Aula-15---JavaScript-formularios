<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 3 - Formulário de Pedido</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="card">
    <h1>Formulário de Pedido</h1>

    <form id="formPedido">
      <label for="produto">Produto</label>
      <select id="produto">
        <option value="100">Teclado - R$ 100</option>
        <option value="50">Mouse - R$ 50</option>
        <option value="800">Monitor - R$ 800</option>
      </select>

      <label for="quantidade">Quantidade</label>
      <input type="number" id="quantidade" min="1" value="1">

      <p id="total" class="total">Total: R$ 0,00</p>
    </form>
  </main>

  <script src="script.js"></script>
</body>

</html>
